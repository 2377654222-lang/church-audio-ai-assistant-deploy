services:
  - type: web
    name: church-audio-ai-assistant
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: church-audio-ai-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: MAX_UPLOAD_MB
        value: 75
      - key: ANALYSIS_SECONDS
        value: 60
      - key: ANALYSIS_SAMPLE_RATE
        value: 22050

databases:
  - name: church-audio-ai-db
    plan: free
